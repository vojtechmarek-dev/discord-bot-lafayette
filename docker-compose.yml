version: '3.8'

services:
  lafayette-bot:
    image: discord-bot-lafayette:latest # Replace with your actual image name
    container_name: lafayette-bot
    restart: unless-stopped
    environment:
      # Environment variables for the bot - use your own values or set them in a .env file
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - CLIENT_ID=${CLIENT_ID}
      - GUILD_ID=${GUILD_ID}
      - BOT_OWNER_ID=${BOT_OWNER_ID}
      - DP_FFMPEG_PATH=/usr/bin/ffmpeg
      # Set to 1 to log which extractor served each query. Off by default.
      - LAFAYETTE_PLAYER_DEBUG=${LAFAYETTE_PLAYER_DEBUG:-0}
      # Where lafayette.db lives. Matches the volume mount below.
      - LAFAYETTE_DATA_DIR=/usr/src/app/data
      # WAL needs working POSIX locking; set TRUNCATE if bot_data ever moves to NFS/SMB.
      - LAFAYETTE_SQLITE_JOURNAL_MODE=${LAFAYETTE_SQLITE_JOURNAL_MODE:-WAL}
    volumes:
      - ./bot_data:/usr/src/app/data  # persistent storage for bot data - make sure to set proper permissions

    healthcheck:
      # Bot rewrites /tmp/lafayette-healthy every 60s while Discord WS is READY.
      # Unhealthy if file missing or older than 2 minutes.
      test: ["CMD-SHELL", "find /tmp/lafayette-healthy -mmin -2 | grep -q . || exit 1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

    # Resource limits (optional)
    #deploy:
    #  resources:
    #    limits:
    #      memory: 512M
    #      cpus: '0.5'
    #    reservations:
    #      memory: 256M
    #      cpus: '0.25'